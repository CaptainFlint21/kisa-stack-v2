name: Validate KISA Stack

on:
  push:
    branches:
      - main
      - codex/kate-hermes-integration
      - codex/kate-user-proxy-hardening
      - codex/kate-global-config-hardening
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          bash -n install.sh
          bash -n tests/test-install.sh
          bash -n tests/test-codex-delegator-contract.sh
          bash -n tests/test-codex-wrapper.sh
          bash -n tests/test-kate-global-codex-config.sh
          bash -n tests/test-kate-user-proxy.sh
          bash -n tests/test-kate-telegram-policy.sh
          bash -n deploy/kate/bootstrap.sh
          bash -n deploy/kate/codex-global-config.sh
          bash -n deploy/kate/codex-wrapper.sh
          bash -n deploy/kate/user-proxy.sh
          bash -n deploy/kate/templates/load-codex-proxy.bash
          bash -n deploy/kate/rollback.sh
          bash -n deploy/kate/verify.sh
          for hook in deploy/kate/hooks/*.sh; do bash -n "$hook"; done

      - name: Run ShellCheck
        run: |
          shellcheck install.sh tests/test-install.sh \
            tests/test-codex-delegator-contract.sh \
            tests/test-codex-wrapper.sh \
            tests/test-kate-global-codex-config.sh \
            tests/test-kate-user-proxy.sh \
            tests/test-kate-telegram-policy.sh \
            deploy/kate/bootstrap.sh deploy/kate/codex-global-config.sh \
            deploy/kate/codex-wrapper.sh deploy/kate/user-proxy.sh \
            deploy/kate/templates/load-codex-proxy.bash deploy/kate/rollback.sh \
            deploy/kate/verify.sh deploy/kate/hooks/*.sh

      - name: Run installer regression tests
        run: |
          bash tests/test-install.sh
          bash tests/test-codex-delegator-contract.sh
          bash tests/test-codex-wrapper.sh
          bash tests/test-kate-global-codex-config.sh
          bash tests/test-kate-user-proxy.sh
          bash tests/test-kate-telegram-policy.sh
