# Rendered by deploy/kate/bootstrap.sh. Secrets stay in ~/.hermes/config.yaml,
# never in Git. The resulting file must be chmod 0600.

model:
  provider: "openai-codex"

terminal:
  backend: "local"
  cwd: "__HOME__"
  timeout: 300
  lifetime_seconds: 900
  home_mode: "real"

agent:
  coding_context: "auto"
  max_turns: 90

compression:
  enabled: true
  threshold: 0.50
  protect_first_n: 0
  protect_last_n: 20

security:
  redact_secrets: true

mcp_servers:
  codex:
    command: "codex"
    args: ["mcp-server"]
    timeout: 900
    connect_timeout: 60
    supports_parallel_tool_calls: false

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

hooks_auto_accept: false
hooks:
  pre_llm_call:
    - command: "__HOME__/.hermes/hooks/hermes-pre-llm.sh"
      timeout: 10

telegram:
  enabled: __TELEGRAM_ENABLED__
  token: "__TELEGRAM_BOT_TOKEN__"
  dm_policy: "allowlist"
  dm_allow_from:
    - "__TELEGRAM_OWNER_ID__"
  unauthorized_dm_behavior: "ignore"
  group_policy: "allowlist"
  group_allow_from:
    - "__TELEGRAM_OWNER_ID__"
  require_mention: true
  home_channel:
    platform: "telegram"
    chat_id: "__TELEGRAM_GROUP_ID__"
    name: "Kate private group"
  reply_to_mode: "first"
  gateway_restart_notification: false
